name: CTF 7K fresh DNS and TLS reachability
on:
  push:
    paths: ['.github/workflows/ctf-7k-fresh-dns-tls.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and connect to public endpoint
        run: |
          python3 -u - <<'PY' | tee ctf-7k-fresh-endpoint.txt
          import socket, datetime, urllib.request, json, ssl
          print('UTC', datetime.datetime.now(datetime.timezone.utc).isoformat())
          host='yz.hdelf.com'
          addresses=socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
          print('SYSTEM_DNS',[(str(a[0]),a[4]) for a in addresses])
          try:
              with urllib.request.urlopen('https://dns.google/resolve?name='+host+'&type=A',timeout=8) as r:
                  print('GOOGLE_DOH',r.read().decode())
          except Exception as e: print('DOH_ERROR',repr(e))
          for port in (80,443):
              try:
                  with socket.create_connection((host,port),timeout=5) as s:
                      print('TCP_OK',port,s.getpeername())
                      if port==443:
                          with ssl.create_default_context().wrap_socket(s,server_hostname=host) as t:
                              print('TLS_OK',t.version(),t.getpeercert())
              except Exception as e: print('CONNECT_ERROR',port,repr(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ctf-7k-fresh-endpoint
          path: ctf-7k-fresh-endpoint.txt
          retention-days: 1
