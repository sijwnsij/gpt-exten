name: ARM64 Android DMA heap module
on:
  push:
    paths:
      - '.github/workflows/systempulse-dma-heap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install compiler and exact matching Debian kernel headers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out packages mod
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-14-aarch64-linux-gnu clang-format-18
          for FILE in linux-headers-6.12.111+deb13-common_6.12.111-1_all.deb linux-headers-6.12.111+deb13-arm64_6.12.111-1_arm64.deb linux-kbuild-6.12.111+deb13_6.12.111-1_amd64.deb; do
            OK=0
            for BASE in https://deb.debian.org/debian/pool/main/l/linux https://security.debian.org/debian-security/pool/updates/main/l/linux; do
              if curl -fL --retry 2 "$BASE/$FILE" -o "packages/$FILE"; then OK=1; break; fi
            done
            test "$OK" = 1
            sudo dpkg-deb -x "packages/$FILE" /
          done
          sha256sum packages/* > out/kernel-header-package-hashes.txt
      - name: Build unmodified upstream DMA heap allocation code as one module
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://raw.githubusercontent.com/gregkh/linux/v6.12.111/drivers/dma-buf/dma-heap.c -o mod/dma-heap.c
          curl -fL --retry 3 https://raw.githubusercontent.com/gregkh/linux/v6.12.111/drivers/dma-buf/heaps/system_heap.c -o mod/system_heap.c
          sha256sum mod/*.c > out/upstream-source-hashes.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mod/dma-heap.c');s=p.read_text()
          s='#include <linux/module.h>\n'+s
          s=s.replace('subsys_initcall(dma_heap_init);','''extern int lab_system_heap_create(void);
          static int __init lab_dmabuf_init(void) {
              int rc = dma_heap_init();
              return rc ? rc : lab_system_heap_create();
          }
          module_init(lab_dmabuf_init);
          MODULE_LICENSE("GPL");
          MODULE_DESCRIPTION("Linux 6.12.111 DMA-BUF system heap for isolated ARM64 Android");
          MODULE_IMPORT_NS(DMA_BUF);
          ''')
          p.write_text(s)
          p=Path('mod/system_heap.c');s=p.read_text().replace('static int system_heap_create(void)','int lab_system_heap_create(void)').replace('module_init(system_heap_create);','');p.write_text(s)
          Path('mod/Makefile').write_text('obj-m += lab_dmabuf_heap.o\nlab_dmabuf_heap-y := dma-heap.o system_heap.o\n')
          PY
          make -C /usr/src/linux-headers-6.12.111+deb13-arm64 M="$PWD/mod" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=aarch64-linux-gnu-gcc-14 CONFIG_DEBUG_INFO_BTF_MODULES= modules -j2
          cp mod/lab_dmabuf_heap.ko mod/Makefile mod/dma-heap.c mod/system_heap.c out/
          modinfo out/lab_dmabuf_heap.ko > out/module-info.txt
          curl -fL --retry 3 https://raw.githubusercontent.com/sijwnsij/gpt-exten/main/android-ui-test/uinput_touch.c -o out/uinput_touch.formatted.c
          clang-format-18 -i out/uinput_touch.formatted.c
          cd out
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systempulse-dmabuf-system-heap-linux6.12.111-arm64
          path: out/
          retention-days: 400
          compression-level: 0
