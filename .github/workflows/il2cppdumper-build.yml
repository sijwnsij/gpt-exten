name: Build Il2CppDumper Linux CLI
on:
  push:
    paths:
      - '.github/workflows/il2cppdumper-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Clone upstream 3.2.1 and publish linux-x64
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch 3.2.1 --depth 1 https://github.com/AndnixSH/Il2CppDumper.git upstream
          dotnet publish upstream/Il2CppDumper.CLI/Il2CppDumper.CLI.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./dumper-out
          ls -lh dumper-out
          tar -czf Il2CppDumper-3.2.1-linux-x64.tar.gz -C dumper-out .
          sha256sum Il2CppDumper-3.2.1-linux-x64.tar.gz
          du -h Il2CppDumper-3.2.1-linux-x64.tar.gz
      - name: Upload temporary binary
        uses: actions/upload-artifact@v4
        with:
          name: il2cppdumper-linux-x64-3.2.1
          path: Il2CppDumper-3.2.1-linux-x64.tar.gz
          retention-days: 1
          if-no-files-found: error
