name: Temporary ChatGPT Android APK fetch for static analysis
on:
  push:
    paths:
      - '.github/workflows/chatgpt-apk-fetch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public ChatGPT APK package
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          urls=(
            'https://d.apkpure.com/b/XAPK/com.openai.chatgpt?version=latest'
            'https://d.apkpure.com/b/XAPK/com.openai.chatgpt?version=1.2026.314'
            'https://d.apkpure.com/b/APK/com.openai.chatgpt?version=latest'
          )
          for index in "${!urls[@]}"; do
            url="${urls[$index]}"
            echo "Trying source ${index}" | tee -a out/download-log.txt
            curl -fSL --retry 2 --connect-timeout 18 --max-time 220 -A 'Mozilla/5.0' -D out/headers.txt -o out/ChatGPT-Android-2026-314.xapk "$url" 2>>out/download-log.txt || true
            if python3 -c "import os,zipfile,sys; p='out/ChatGPT-Android-2026-314.xapk'; sys.exit(0 if os.path.exists(p) and os.stat(p).st_size>30000000 and zipfile.is_zipfile(p) else 1)"; then
              echo "Downloaded valid ZIP based APK/XAPK package from source ${index}" | tee -a out/download-log.txt
              break
            fi
            rm -f out/ChatGPT-Android-2026-314.xapk
          done
          if [ -f out/ChatGPT-Android-2026-314.xapk ]; then
            sha256sum out/ChatGPT-Android-2026-314.xapk | tee out/SHA256SUMS.txt
            python3 - <<'PY'
          import zipfile,json,os
          p='out/ChatGPT-Android-2026-314.xapk'
          with zipfile.ZipFile(p) as z:
            names=z.namelist()
            print('Entries:',len(names),'size:',os.stat(p).st_size)
            for x in names[:35]:print(x)
            for x in ('manifest.json','info.json'):
              if x in names:
                d=z.read(x)
                print(x, d[:3000].decode('utf-8','replace'))
          PY
          fi
      - name: Probe alternate public mirrors
        shell: bash
        run: |
          mkdir -p out
          for url in \
            'https://chatgpt.en.uptodown.com/android/download' \
            'https://www.apkmirror.com/wp-content/themes/APKMirror/download.php?id=17260373&key=d5084860734e703d27269958f9c772b8b930d33f' \
            'https://apkcombo.com/chatgpt/com.openai.chatgpt/download/apk' \
            'https://ws75.aptoide.com/api/7/app/getMeta?package_name=com.openai.chatgpt' \
            ; do
            echo "#### Testing $url" | tee -a out/mirror-diagnostics.txt
            curl -sSL --connect-timeout 8 --max-time 35 --range 0-10000 -D out/tmp-headers.txt -o out/tmp-body.dat -w 'final_url=%{url_effective} code=%{http_code} size=%{size_download} type=%{content_type}\\n' "$url" 2>&1 | tee -a out/mirror-diagnostics.txt || true
            head -c 500 out/tmp-headers.txt >> out/mirror-diagnostics.txt || true
            echo >> out/mirror-diagnostics.txt
            file out/tmp-body.dat >> out/mirror-diagnostics.txt || true
            strings out/tmp-body.dat | grep -ioE '.{0,100}(download|xapk|[.]apkm|[.]apk|dw[.]uptodown|id_download).{0,200}' | head -n 18 >> out/mirror-diagnostics.txt || true
          done
          cat out/mirror-diagnostics.txt
      - name: Upload short-lived analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-android-apk-temporary
          path: out/
          retention-days: 1
          if-no-files-found: error
