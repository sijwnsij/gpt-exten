name: CTF 7K regional DNS diagnosis
on:
  push:
    paths:
      - '.github/workflows/ctf-7k-regional-dns.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query regional resolvers and verify returned endpoints
        shell: python
        run: |
          import concurrent.futures,json,socket,ssl,time,urllib.request
          host="yz.hdelf.com"
          urls=[
            "https://dns.google/resolve?name="+host+"&type=A&edns_client_subnet=114.114.114.0/24",
            "https://dns.google/resolve?name="+host+"&type=A&edns_client_subnet=223.5.5.0/24",
            "https://dns.alidns.com/resolve?name="+host+"&type=A",
            "https://doh.pub/dns-query?name="+host+"&type=A",
          ]
          def query(url):
            try:
              req=urllib.request.Request(url,headers={"accept":"application/dns-json"})
              with urllib.request.urlopen(req,timeout=8) as r: data=json.load(r)
              return {"url":url,"response":data}
            except Exception as e:return {"url":url,"error":str(e)}
          result=list(concurrent.futures.ThreadPoolExecutor(4).map(query,urls))
          ips=sorted({a["data"] for r in result for a in r.get("response",{}).get("Answer",[]) if a.get("type")==1})
          def connect(pair):
            ip,port=pair; start=time.monotonic()
            try:
              with socket.create_connection((ip,port),timeout=5) as s:
                item={"ip":ip,"port":port,"tcp":"connected"}
                if port==443:
                  with ssl.create_default_context().wrap_socket(s,server_hostname=host) as t:
                    item["tls"]=t.version(); item["certificate"]=t.getpeercert()
                return item
            except Exception as e:return {"ip":ip,"port":port,"elapsed":round(time.monotonic()-start,3),"error":str(e)}
          connections=list(concurrent.futures.ThreadPoolExecutor(8).map(connect,[(ip,p) for ip in ips for p in [80,443]]))
          report={"utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"dns":result,"connections":connections}
          print(json.dumps(report,ensure_ascii=False,indent=2))
          open("regional-dns.json","w").write(json.dumps(report,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: ctf-7k-regional-dns
          path: regional-dns.json
          retention-days: 1
