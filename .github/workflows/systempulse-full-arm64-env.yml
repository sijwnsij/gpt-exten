name: SystemPulse full ARM64 Android environment
on:
  push:
    paths:
      - '.github/workflows/systempulse-full-arm64-env.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch and export official ARM64 Android 12 image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metadata parts host-tools rootfs
          docker pull --platform linux/arm64 redroid/redroid:12.0.0_64only-latest
          docker image inspect redroid/redroid:12.0.0_64only-latest > metadata/redroid-image-inspect.json
          CID=$(docker create --platform linux/arm64 redroid/redroid:12.0.0_64only-latest)
          docker export "$CID" -o redroid-rootfs.tar
          docker rm "$CID"
          sudo tar --xattrs --numeric-owner -xpf redroid-rootfs.tar -C rootfs
          sudo find rootfs -maxdepth 3 -type f -name '*init*' > metadata/init-file-list.txt
          sudo tar -czf metadata/android-init-configs.tar.gz -C rootfs --ignore-failed-read system/etc/init vendor/etc/init odm/etc/init product/etc/init system/etc/cgroups.json system/etc/task_profiles.json system/build.prop vendor/build.prop
          sudo du -sh rootfs > metadata/rootfs-size.txt
          sudo find rootfs/system/framework rootfs/apex -maxdepth 2 -type f > metadata/framework-file-list.txt
          rm redroid-rootfs.tar
          truncate -s 6G redroid12-arm64.ext4
          sudo mkfs.ext4 -q -F -b 4096 -I 256 -L redroid12 -E lazy_itable_init=0,lazy_journal_init=0 -d rootfs redroid12-arm64.ext4
          sudo e2fsck -fn redroid12-arm64.ext4
          sudo chmod 644 redroid12-arm64.ext4
          sha256sum redroid12-arm64.ext4 > metadata/root-image.sha256
          stat -c %s redroid12-arm64.ext4 > metadata/root-image.size
          zstd -T0 -8 redroid12-arm64.ext4 -o redroid12-arm64.ext4.zst
          sha256sum redroid12-arm64.ext4.zst > metadata/compressed-image.sha256
          stat -c %s redroid12-arm64.ext4.zst > metadata/compressed-image.size
          split -b 100000000 -d -a 3 redroid12-arm64.ext4.zst parts/redroid12-arm64.ext4.zst.part-
      - name: Fetch official adb and scrcpy host tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://dl.google.com/android/repository/platform-tools-latest-linux.zip -o platform-tools.zip
          unzip -q platform-tools.zip -d host-tools
          cp host-tools/platform-tools/source.properties metadata/platform-tools-source.properties
          curl -fL --retry 3 https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-linux-x86_64-v5.0.1.tar.gz -o scrcpy-linux-x86_64-v5.0.1.tar.gz
          curl -fL --retry 3 https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/SHA256SUMS.txt -o metadata/scrcpy-SHA256SUMS.txt
          sha256sum --check --ignore-missing metadata/scrcpy-SHA256SUMS.txt
          tar -xzf scrcpy-linux-x86_64-v5.0.1.tar.gz -C host-tools
          tar -czf host-tools-android-ui-linux-x86_64.tar.gz -C host-tools .
          sha256sum host-tools-android-ui-linux-x86_64.tar.gz > metadata/host-tools.sha256
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          def item(p):
              p=pathlib.Path(p)
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(8388608),b''):h.update(b)
              return dict(file=str(p),size=p.stat().st_size,sha256=h.hexdigest())
          inspect=json.loads((root/'metadata/redroid-image-inspect.json').read_text())[0]
          manifest=dict(image='redroid/redroid:12.0.0_64only-latest',architecture=inspect['Architecture'],repo_digests=inspect.get('RepoDigests'),config=inspect['Config'],original=item('redroid12-arm64.ext4'),compressed=item('redroid12-arm64.ext4.zst'),parts=[item(p) for p in sorted((root/'parts').glob('*'))],host_tools=item('host-tools-android-ui-linux-x86_64.tar.gz'),platform_tools=(root/'metadata/platform-tools-source.properties').read_text(),scrcpy_version='5.0.1')
          assert manifest['architecture']=='arm64'
          assert all(p['size']<=100000000 for p in manifest['parts'])
          (root/'metadata/manifest.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - name: Upload environment manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systempulse-full-arm64-env-manifest
          path: metadata
          retention-days: 400
          compression-level: 0
      - name: Upload Android UI host tools
        uses: actions/upload-artifact@v4
        with:
          name: systempulse-android-ui-host-tools-linux-x86_64
          path: host-tools-android-ui-linux-x86_64.tar.gz
          retention-days: 400
          compression-level: 0
      - name: Upload ARM64 Android image part 000
